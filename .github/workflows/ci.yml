name: Continuous Integration

# 1. Триггеры: запускать пайплайн при пуше и пулл-реквестах в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Задача 1: Тестирование и линтинг кода
  test-and-lint:
    runs-on: ubuntu-latest # Запускать на виртуальной машине с Ubuntu

    steps:
      # Шаг 1.1: Клонирование кода из репозитория на Runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Шаг 1.2: Настройка окружения Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Шаг 1.3: Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      # Шаг 1.4: Проверка стиля кода (Линтер)
      - name: Lint code with flake8
        run: |
          # остановка сборки при синтаксических ошибках
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Шаг 1.5: Запуск автоматических тестов
      - name: Run unit tests
        run: |
          pytest test_main.py

  # Задача 2: Пробная сборка Docker-образа (выполняется ПОСЛЕ успешных тестов)
  build-docker:
    needs: test-and-lint # Зависимость: запустится только если test-and-lint прошёл успешно
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t test-app:latest .
