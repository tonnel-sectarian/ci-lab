name: Continuous Integration

# 1. Триггеры: запускать пайплайн при пуше и пулл-реквестах в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Задача 1: Тестирование и линтинг кода
  test-and-lint:
    runs-on: ubuntu-latest # Запускать на виртуальной машине с Ubuntu
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      # Шаг 1.1: Клонирование кода из репозитория на Runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Шаг 1.2: Настройка окружения Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}

      # Шаг 1.3: Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      # Шаг 1.4: Проверка стиля кода (Линтер)
      - name: Lint code with flake8
        run: |
          # остановка сборки при синтаксических ошибках
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Шаг 1.5: Запуск автоматических тестов
      - name: Run unit tests
        run: |
          pytest test_main.py
      
      #Шаг 1.6: Установка анализатора bandit
      - name: Install bandit
        run: |
          pip install bandit

      #Шаг 1.7: Запуск бандита))
      - name: Запуск бандита
        run: |
          bandit -r main.py

  # Задача 2: Cборка Docker-образа и пуш в registry (выполняется ПОСЛЕ успешных тестов)
  build-docker-and-push:
    needs: test-and-lint # Зависимость: запустится только если test-and-lint прошёл успешно
    runs-on: ubuntu-latest
    # Запускаем сборку и пуш только при пуше в main (пропускаем для Pull Request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'


    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      #Используем секреты для безопасного входа
      - name: Логинимся в DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      
      #Сборка и пуш
      - name: Сборка и пуш
        uses: docker/build-push-action@v5
        with:
         context: .
         push: true
         tags:  ${{secrets.DOCKERHUB_USERNAME }}/ci-lab:latest, ${{ github.sha }} 
